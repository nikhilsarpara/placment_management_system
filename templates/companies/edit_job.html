{% extends 'base.html' %}
{% block title %}Edit Job: {{ job.title }} - {{ company.company_name }}{% endblock %}
{% block page_title %}Edit Job Posting{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card shadow-sm border">
      <div class="card-header bg-white py-3 border-bottom d-flex align-items-center justify-content-between">
        <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Edit: {{ job.title }}</h5>
        <span class="badge {% if job.status == 'OPEN' %}badge-open{% else %}badge-closed{% endif %}">{{ job.status }}</span>
      </div>
      <div class="card-body p-4">
        <form method="post" action="{% url 'companies:edit_job' job.id %}">
          {% csrf_token %}
          <div class="form-group mb-3">
            <label class="form-label" for="title">Job Title</label>
            <input type="text" name="title" id="title" class="form-control" value="{{ job.title }}" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label" for="job_type">Employment Type</label>
              <select name="job_type" id="job_type" class="form-select">
                {% for jt in job_types %}
                  <option value="{{ jt }}" {% if job.job_type == jt %}selected{% endif %}>{{ jt }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="status">Job Status</label>
              <select name="status" id="status" class="form-select">
                {% for js in job_statuses %}
                  <option value="{{ js }}" {% if job.status == js %}selected{% endif %}>{{ js }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="ctc">Package (CTC)</label>
              <input type="text" name="ctc" id="ctc" class="form-control" value="{{ job.ctc|default:'' }}">
            </div>
            <div class="col-md-3">
              <label class="form-label" for="location">Location</label>
              <input type="text" name="location" id="location" class="form-control" value="{{ job.location|default:'' }}">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label" for="openings">Openings</label>
              <input type="number" name="openings" id="openings" class="form-control" value="{{ job.openings }}" min="1">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="skills">Skills Required (Comma-separated)</label>
              <input type="text" name="skills" id="skills" class="form-control" value="{{ job.skills_required|join:', ' }}">
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="form-label" for="description">Job Description</label>
            <textarea name="description" id="description" rows="6" class="form-control" required>{{ job.description }}</textarea>
          </div>

          <div class="d-flex justify-content-between">
            <a href="{% url 'companies:jobs' %}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary px-4">
              <i class="fa-solid fa-floppy-disk me-1"></i> Update Job
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
