{% extends 'base.html' %}
{% block title %}Register – Student{% endblock %}
{% block content %}
<div class="auth-page" style="align-items:flex-start; padding:2rem 1rem;">
  <div class="auth-card" style="max-width:540px;">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="fa-solid fa-user-graduate"></i>
      </div>
      <h1 class="auth-title">Student Registration</h1>
      <p class="auth-subtitle">Create your PlacePro account and start your placement journey.</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}
      <div class="grid-2" style="gap:1rem;">
        <div class="form-group">
          <label class="form-label">First Name *</label>
          <input type="text" name="first_name" class="form-control" value="{{ post.first_name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name *</label>
          <input type="text" name="last_name" class="form-control" value="{{ post.last_name }}" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="form-control" placeholder="you@email.com" value="{{ post.email }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">University *</label>
        <select name="university_id" class="form-control" required>
          <option value="">Select your university</option>
          {% for uni in universities %}
            <option value="{{ uni.id }}" {% if post.university_id == uni.id|stringformat:'s' %}selected{% endif %}>
              {{ uni.name }}
            </option>
          {% empty %}
            <option disabled>No approved universities yet</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Roll Number</label>
        <input type="text" name="roll_number" class="form-control" placeholder="Your roll/enrollment number" value="{{ post.roll_number }}">
      </div>
      <div class="form-group">
        <label class="form-label">Phone</label>
        <input type="tel" name="phone" class="form-control" value="{{ post.phone }}">
      </div>
      <div class="grid-2" style="gap:1rem;">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg">
        <i class="fa-solid fa-user-plus"></i> Create Account
      </button>
    </form>
    <div class="text-center mt-3 fs-sm">
      Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
