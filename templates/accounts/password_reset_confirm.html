{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="auth-title">New Password</h1>
      <p class="auth-subtitle">Please enter and confirm your new password</p>
    </div>

    <form method="post" action="{% url 'accounts:password_reset_confirm' token=token %}" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="password">New Password</label>
        <div style="position:relative;">
          <span style="position:absolute;left:0.8rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" name="password" class="form-control" style="padding-left:2.25rem;"
                 placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <div style="position:relative;">
          <span style="position:absolute;left:0.8rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" style="padding-left:2.25rem;"
                 placeholder="Re-enter password" required minlength="8" autocomplete="new-password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">
        <i class="fa-solid fa-check me-1"></i> Update Password
      </button>
    </form>

    <div class="text-center mt-4" style="font-size:0.875rem;">
      <a href="{% url 'accounts:login' %}" class="text-muted text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
