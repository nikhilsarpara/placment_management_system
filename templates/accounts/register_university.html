{% extends 'base.html' %}
{% block title %}Register – University{% endblock %}
{% block content %}
<div class="auth-page" style="align-items:flex-start; padding:2rem 1rem;">
  <div class="auth-card" style="max-width:600px;">
    <div class="auth-logo">
      <div class="auth-logo-icon" style="background:var(--color-secondary);">
        <i class="fa-solid fa-university"></i>
      </div>
      <h1 class="auth-title">Register University</h1>
      <p class="auth-subtitle">Get your institution on PlacePro. Admin approval required.</p>
    </div>

    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      <div class="grid-2" style="gap:1rem;">
        <div class="form-group">
          <label class="form-label">University Name *</label>
          <input type="text" name="name" class="form-control" placeholder="e.g. ABC University" value="{{ post.name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Affiliation</label>
          <input type="text" name="affiliation" class="form-control" placeholder="e.g. UGC, AICTE" value="{{ post.affiliation }}">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" placeholder="admin@university.edu" value="{{ post.email }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Website</label>
          <input type="url" name="website" class="form-control" placeholder="https://university.edu" value="{{ post.website }}">
        </div>
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>
        <div class="form-group">
          <label class="form-label">Placement Officer</label>
          <input type="text" name="placement_officer" class="form-control" placeholder="Full name" value="{{ post.placement_officer }}">
        </div>
        <div class="form-group">
          <label class="form-label">Contact Phone</label>
          <input type="tel" name="contact_phone" class="form-control" placeholder="+91 XXXXX XXXXX" value="{{ post.contact_phone }}">
        </div>
        <div class="form-group">
          <label class="form-label">City</label>
          <input type="text" name="city" class="form-control" value="{{ post.city }}">
        </div>
        <div class="form-group">
          <label class="form-label">State</label>
          <input type="text" name="state" class="form-control" value="{{ post.state }}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="2" placeholder="Full address">{{ post.address }}</textarea>
      </div>
      <div class="grid-2" style="gap:1rem;">
        <div class="form-group">
          <label class="form-label">University Logo</label>
          <input type="file" name="logo" class="form-control" accept="image/*">
          <div class="form-hint">JPG, PNG, max 5MB</div>
        </div>
        <div class="form-group">
          <label class="form-label">Verification Document</label>
          <input type="file" name="verification_doc" class="form-control" accept=".pdf,.doc,.docx">
          <div class="form-hint">PDF or Word, max 5MB</div>
        </div>
      </div>
      <button type="submit" class="btn btn-secondary w-100 btn-lg">
        <i class="fa-solid fa-paper-plane"></i> Submit Registration
      </button>
    </form>
    <div class="text-center mt-3 fs-sm">
      Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
    </div>
  </div>
</div>
{% endblock %}
