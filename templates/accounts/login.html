{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your PlacePro account</p>
    </div>

    <form method="post" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div style="position:relative;">
          <span style="position:absolute;left:0.8rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" id="email" name="email" class="form-control" style="padding-left:2.25rem;"
                 placeholder="you@example.com" value="{{ request.POST.email }}" required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label mb-0" for="password">Password</label>
          <a href="{% url 'accounts:password_reset' %}" class="text-primary fs-sm">Forgot password?</a>
        </div>
        <div style="position:relative;">
          <span style="position:absolute;left:0.8rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" name="password" class="form-control" style="padding-left:2.25rem;"
                 placeholder="••••••••" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div class="text-center mt-4" style="font-size:0.875rem; color:var(--color-text-muted);">
      Don't have an account?
    </div>
    <div class="grid-3 mt-2" style="gap:0.5rem;">
      <a href="{% url 'accounts:register_student' %}" class="btn btn-outline btn-sm text-center">
        <i class="fa-solid fa-user-graduate"></i> Student
      </a>
      <a href="{% url 'accounts:register_university' %}" class="btn btn-outline btn-sm text-center">
        <i class="fa-solid fa-university"></i> University
      </a>
      <a href="{% url 'accounts:register_company' %}" class="btn btn-outline btn-sm text-center">
        <i class="fa-solid fa-building"></i> Company
      </a>
    </div>
  </div>
</div>
{% endblock %}
