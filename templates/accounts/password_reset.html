{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="fa-solid fa-key"></i>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your registered email address to receive password reset instructions</p>
    </div>

    <form method="post" action="{% url 'accounts:password_reset' %}" novalidate>
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div style="position:relative;">
          <span style="position:absolute;left:0.8rem;top:50%;transform:translateY(-50%);color:var(--color-text-muted);">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" id="email" name="email" class="form-control" style="padding-left:2.25rem;"
                 placeholder="you@example.com" value="{{ request.POST.email }}" required autocomplete="email" />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg mt-2">
        <i class="fa-solid fa-paper-plane me-1"></i> Send Reset Link
      </button>
    </form>

    <div class="text-center mt-4" style="font-size:0.875rem;">
      <a href="{% url 'accounts:login' %}" class="text-muted text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
