{% extends 'base.html' %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="p-5 bg-white rounded-4 shadow-sm border mt-4">
        <div class="mb-4">
          <i class="fa-solid fa-triangle-exclamation text-danger" style="font-size: 4.5rem; opacity: 0.85;"></i>
        </div>
        <h1 class="display-4 fw-bold text-dark mb-2">500</h1>
        <h3 class="h4 fw-semibold text-secondary mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">Something went wrong on our end while processing your request. Please try again shortly or contact support.</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="/" class="btn btn-primary px-4 py-2">
            <i class="fa-solid fa-house me-1"></i> Back to Home
          </a>
          <button onclick="location.reload()" class="btn btn-outline px-4 py-2">
            <i class="fa-solid fa-rotate-right me-1"></i> Refresh Page
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
