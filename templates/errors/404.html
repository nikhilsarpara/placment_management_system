{% extends 'base.html' %}
{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="p-5 bg-white rounded-4 shadow-sm border mt-4">
        <div class="mb-4">
          <i class="fa-solid fa-compass-drafting text-primary" style="font-size: 4.5rem; opacity: 0.85;"></i>
        </div>
        <h1 class="display-4 fw-bold text-dark mb-2">404</h1>
        <h3 class="h4 fw-semibold text-secondary mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The page or resource you are looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="/" class="btn btn-primary px-4 py-2">
            <i class="fa-solid fa-house me-1"></i> Back to Home
          </a>
          <button onclick="history.back()" class="btn btn-outline px-4 py-2">
            <i class="fa-solid fa-arrow-left me-1"></i> Go Back
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
